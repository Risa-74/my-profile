<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-amber-100">
    <header class="bg-white-600 shadow px-6 py-4">
      <h1 class="text-2x1 font-bold text-gray-900">SS Cafe</h1>
      <p class="text-gray-600 text-sm mt-1">横浜スペシャルコーヒーショップ</p>
    </header>

    <main class="max-w-2x1 mx-auto px-4 py-8">
      <section class="mb-8">
        <h2 class="text-x1 font-bold text-gray-800 mb-4">ドリンク</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-10">
          <h3 class="text-lg font-bold text-gray-900">コーヒー</h3>
          <p class="text-gray-600 mt-1">本日のおすすめ。焙煎による豊かな香りと深みのある味わい</p>
          <p class="text-red-600 font-bold mt-2">550円</p>
          <button class="bg-orange-300 text-white px-4 py-2 rounded hover:bg-orange-500">注文する</button>
          <a href="#" class="text-orange-300 underline hover:text-orange-500">詳細を見る</a>
        </div>

        <h2 class="text-x1 font-bold text-gray-800 mb-4">フード</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-10">
          <h3 class="text-lg font-bold text-gray-900">バターチキンカレー</h3>
          <p class="text-gray-600 mt-1">まろやかでコクのある、クリーミーなチキンカレー</p>
          <p class="text-red-600 font-bold mt-2">900円</p>
          <button class="bg-orange-300 text-white px-4 py-2 rounded hover:bg-orange-500">注文する</button>
          <a href="#" class="text-orange-300 underline hover:text-orange-500">詳細を見る</a>
        </div>

        <h2 class="text-x1 font-bold text-gray-800 mb-4">スイーツ</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-10">
          <h3 class="text-lg font-bold text-gray-900">パンケーキ</h3>
          <p class="text-gray-600 mt-1">ふんわりと焼き上げた生地に、バターとメイプルシロップを添えた王道のパンケーキ</p>
          <p class="text-red-600 font-bold mt-2">700円</p>
          <button class="bg-orange-300 text-white px-4 py-2 rounded hover:bg-orange-500">注文する</button>
          <a href="#" class="text-orange-300 underline hover:text-orange-500">詳細を見る</a>
        </div>
      </section>
    </main>

    <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
      <p>2026 SS Cafe</p>
    </footer>
  </body>
</html>
